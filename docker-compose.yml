# agent-stack v2 的容器编排
#
# ⚠️ 容器名与端口都带 v2 后缀，是为了**与 v1 并存**：
#    v1 的项目（D:\Python\janyu2cs_projects\agent-lite）已经在用
#    容器名 `agent-lite` 和端口 8000，从 2026-07-19 起持续运行。
#    这里换个名字，两边互不干扰。
#    容器内部的互相访问仍走服务名（agent-lite / go-gateway），不受影响。
services:
  agent-lite:
    build:
      context: ./agent-lite
      dockerfile: Dockerfile
    container_name: agent-lite-v2
    ports:
      - "8100:8000"          # 宿主机 8100 → 容器 8000（避让 v1 的 8000）
    env_file:
      - .env
    volumes:
      - ./agent-lite/logs:/app/logs
      - ./agent-lite/chroma_db:/app/chroma_db
      - ./agent-lite/models:/app/models      # 本地 embedding 模型，保证离线可部署
    restart: unless-stopped

  go-gateway:
    build:
      context: ./go-gateway
      dockerfile: Dockerfile
    container_name: go-gateway-v2
    ports:
      - "3100:3000"          # 宿主机 3100 → 容器 3000（避让常用端口）
    env_file:
      - .env
    environment:
      # 容器内必须用服务名，不能用 localhost（localhost 指向网关自己）
      # 修复历史：v1 写死 localhost，导致容器部署时网关永远连不上 agent-lite
      AGENT_LITE_HOST: agent-lite
    depends_on:
      - agent-lite
    restart: unless-stopped
